<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Coaching Registration Form</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
  </head>

  <body class="bg-light">
    <header>
      <div
        class="container-fluid bg-primary px-3 py-1 d-flex justify-content-between"
      >
        <div class="d-flex gap-3">
          <img
            src="./flower.jpg"
            width="50"
            height="50"
            class="rounded-circle"
          />
          <h1 class="text-light">Registration Page</h1>
        </div>
        <button class="btn btn-info">Student Login</button>
      </div>
    </header>

    <main>
      <div class="container bg-white border rounded shadow p-3 mt-3">
        <!-- Personal Information -->
        <div class="border border-dark rounded p-3 pt-4 my-3 position-relative">
          <span
            class="px-2 fs-5 position-absolute bg-white text-primary"
            style="top: -15px"
          >
            Personal Information
          </span>

          <div class="d-grid gap-3">
            <div class="d-flex align-items-center">
              <label class="form-label w-25">Full Name *</label>
              <input id="fullname" class="form-control" />
              <span class="text-danger Error ms-2" id="nameError"></span>
            </div>

            <div class="d-flex align-items-center">
              <label class="form-label w-25">Email *</label>
              <input id="email" class="form-control" />
              <span class="text-danger Error ms-2" id="emailError"></span>
            </div>

            <div class="d-flex align-items-center">
              <label class="form-label w-25">Mobile *</label>
              <input type="number" id="mobile" class="form-control" />
              <span class="text-danger Error ms-2" id="mobError"></span>
            </div>

            <div class="d-flex align-items-center">
              <label class="form-label w-25">DOB *</label>
              <input type="date" id="dob" class="form-control" />
              <span class="text-danger Error ms-2" id="dobError"></span>
            </div>
          </div>
        </div>

        <!-- Academic -->
        <div class="border border-dark rounded p-3 pt-4 my-3 position-relative">
          <span
            class="px-2 fs-5 position-absolute bg-white text-primary"
            style="top: -15px"
          >
            Academic Details
          </span>

          <div class="d-grid gap-3">
            <div class="d-flex align-items-center">
              <label class="form-label w-25">Qualification *</label>
              <select id="Qualification" class="form-select">
                <option value="" selected disabled>--Select Qualification--</option>
                <option value="10">10th</option>
                <option value="12">12th</option>
                <option value="UG">Under Graduate</option>
                <option value="PG">Post Graduate</option>
              </select>
              <span class="text-danger Error ms-2" id="qError"></span>
            </div>

            <div class="d-flex align-items-center">
              <label class="form-label w-25">Percentage *</label>
              <input id="grade" class="form-control" />
              <span class="text-danger Error ms-2" id="gradeError"></span>
            </div>
          </div>
        </div>

        <!-- Course -->
        <div class="border border-dark rounded p-3 pt-4 my-3 position-relative">
          <span
            class="px-2 fs-5 position-absolute bg-white text-primary"
            style="top: -15px"
          >
            Course Information
          </span>

          <div class="d-grid gap-3">
            <div class="d-flex align-items-center">
              <label class="form-label w-25">Course *</label>
              <select id="Preferred" class="form-select">
                <option value="" selected disabled>--Select Course--</option>
                <option value="p1">IIT-JEE</option>
                <option value="p2">NEET</option>
                <option value="p3">Banking Exams</option>
                <option value="p4">UPSC</option>
              </select>
              <span class="text-danger Error ms-2" id="courseError"></span>
            </div>

            <div class="d-flex align-items-center">
              <label class="form-label w-25">Batch *</label>
              <select id="batch" class="form-select">
                <option value="" selected disabled>--Select Batch timings--</option>
                <option value="morning">Morning</option>
                <option value="afternoon">Afternoon</option>
                <option value="evening">Evening</option>
              </select>
              <span class="text-danger Error ms-2" id="batchError"></span>
            </div>
          </div>
        </div>

        <!-- Address -->
        <div class="border border-dark rounded p-3 pt-4 my-3 position-relative">
          <span
            class="px-2 fs-5 position-absolute bg-white text-primary"
            style="top: -15px"
          >
            Address
          </span>

          <div class="d-grid gap-2">
            <textarea
              id="address"
              class="form-control"
              placeholder="Address"
            ></textarea>
            <span class="text-danger Error" id="addressError"></span>

            <input id="city" class="form-control" placeholder="City" />
            <span class="text-danger Error" id="cityError"></span>

            <input
              type="number"
              id="pin"
              class="form-control"
              placeholder="Pin"
            />
            <span class="text-danger Error" id="pinError"></span>
          </div>
        </div>

        <!-- Guardian -->
        <div class="border border-dark rounded p-3 pt-4 my-3 position-relative">
          <span
            class="px-2 fs-5 position-absolute bg-white text-primary"
            style="top: -15px"
          >
            Guardian Details
          </span>

          <div class="d-grid gap-2">
            <input
              id="gname"
              class="form-control"
              placeholder="Guardian Name"
            />
            <span class="text-danger Error" id="gnError"></span>

            <input
              id="gc"
              class="form-control"
              placeholder="Guardian Contact"
              type="number"
            />
            <span class="text-danger Error" id="gcError"></span>
          </div>
        </div>

        <!-- Additional -->
        <div class="border border-dark rounded p-3 pt-4 my-3 position-relative">
          <span
            class="px-2 fs-5 position-absolute bg-white text-primary"
            style="top: -15px"
          >
            Additional Information
          </span>

          <div>Where did you hear about us:-</div>

          <div class="d-grid gap-3">
            <select id="addinfo" class="form-select">
              <option value="">--Select--</option>
              <option value="FRIENDS">Friends</option>
              <option value="SOCIAL">Social Media</option>
            </select>
            <span class="text-danger Error" id="addError"></span>

            <div>
              some special requirements you have?
              <input
                id="sp"
                class="form-control"
                placeholder="Special Requirements (optional)"
              />
            </div>
          </div>
        </div>

        <div class="text-center">
          <button class="btn btn-success btn-lg" onclick="submit()">
            Submit
          </button>
        </div>
      </div>
    </main>

    <script src="registrationForm.js"></script>
  </body>
</html>
